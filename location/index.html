
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objetos baseados na localização GPS</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false;">

    <a-camera
      gps-camera="simulateLatitude: 51.049; simulateLongitude: -0.723; gpsMinDistance: 5; positionMinAccuracy: 50"
      rotation-reader>
    </a-camera>

    <!-- ENTIDADE 1: texto vermelho -->
    <a-text
      value="Ola Mundo!"
      scale="6 6 6"
      align="center"
      color="#ff0000"
      gps-entity-place="latitude: 51.0491; longitude: -0.723;">
    </a-text>

    <!-- ENTIDADE 2: texto verde -->
    <a-text
      value="Sul"
      scale="6 6 6"
      align="center"
      color="#00aa00"
      gps-entity-place="latitude: 51.0489; longitude: -0.723;">
    </a-text>

    <!-- ENTIDADE 3: cubo azul -->
    <a-box
      color="#2196f3"
      scale="3 3 3"
      position="0 2 0"
      gps-entity-place="latitude: 51.049; longitude: -0.7229;">
    </a-box>

    <!-- ENTIDADE 4: esfera laranja -->
    <a-sphere
      color="#ff9800"
      radius="2"
      position="0 4 0"
      gps-entity-place="latitude: 51.049; longitude: -0.7231;">
    </a-sphere>

    <!-- ENTIDADE 5: cone roxo -->
    <a-cone
      color="#9c27b0"
      radius-bottom="1.5"
      radius-top="0"
      height="4"
      position="0 2 0"
      gps-entity-place="latitude: 51.0491; longitude: -0.7229;">
    </a-cone>

    <!-- ENTIDADE 6: cilindro amarelo -->
    <a-cylinder
      color="#ffeb3b"
      radius="1"
      height="3"
      position="0 2 0"
      gps-entity-place="latitude: 51.0492; longitude: -0.7232;">
    </a-cylinder>

    <!-- ENTIDADE 7: torus rosa -->
    <a-torus
      color="#ff00cc"
      radius="1.5"
      radius-tubular="0.15"
      position="0 3 0"
      gps-entity-place="latitude: 51.0488; longitude: -0.7231;">
    </a-torus>

  </a-scene>
</body>
</html>
