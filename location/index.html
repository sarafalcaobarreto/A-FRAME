
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realidade Aumentada GPS - EsACT Mirandela</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body>
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false;">

    <!-- Câmara com localização GPS real -->
    <a-camera
      gps-camera="gpsMinDistance: 5; positionMinAccuracy: 100"
      rotation-reader>
    </a-camera>

    <!-- TEXTO VERMELHO -->
    <a-text
      value="Ola Mundo!"
      scale="8 8 8"
      align="center"
      color="#ff0000"
      gps-entity-place="latitude: 41.47819; longitude: -7.17817;">
    </a-text>

    <!-- TEXTO VERDE -->
    <a-text
      value="EsACT - IPB"
      scale="6 6 6"
      align="center"
      color="#00ff00"
      gps-entity-place="latitude: 41.47822; longitude: -7.17817;">
    </a-text>

    <!-- CUBO AZUL -->
    <a-box
      color="#2196f3"
      scale="2 2 2"
      position="0 2 0"
      gps-entity-place="latitude: 41.47819; longitude: -7.17812;">
    </a-box>

    <!-- ESFERA LARANJA -->
    <a-sphere
      color="#ff9800"
      radius="1.2"
      position="0 2 0"
      gps-entity-place="latitude: 41.47819; longitude: -7.17822;">
    </a-sphere>

    <!-- CONE ROXO -->
    <a-cone
      color="#9c27b0"
      radius-bottom="1"
      radius-top="0"
      height="2.5"
      position="0 1.5 0"
      gps-entity-place="latitude: 41.47814; longitude: -7.17817;">
    </a-cone>

    <!-- CILINDRO AMARELO -->
    <a-cylinder
      color="#ffeb3b"
      radius="0.8"
      height="2"
      position="0 1 0"
      gps-entity-place="latitude: 41.47824; longitude: -7.17812;">
    </a-cylinder>

    <!-- ANEL ROSA -->
    <a-torus
      color="#ff00cc"
      radius="1"
      radius-tubular="0.12"
      position="0 2 0"
      gps-entity-place="latitude: 41.47824; longitude: -7.17822;">
    </a-torus>

  </a-scene>
</body>
</html>
