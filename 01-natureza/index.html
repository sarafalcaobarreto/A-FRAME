
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiência 01 — Natureza e Ambientes</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
</head>

<body>
  <a-scene>
    
    <!-- COMPONENTE: ENVIRONMENT -->
    <a-entity
      environment="
        preset: forest;
        dressingAmount: 200;
        ground: hills;
        groundYScale: 5;
        dressing: trees;
        playArea: 2;
        shadow: true;
      ">
    </a-entity>

    <!-- IDENTIFICAÇÃO DA EXPERIÊNCIA -->
    <a-entity position="0 3 -5">
      <a-text
        value="01 — NATUREZA E AMBIENTES"
        align="center"
        color="#FFFFFF"
        width="8">
      </a-text>
    </a-entity>

    <!-- CÂMARA E MOVIMENTO -->
    <a-entity position="0 1.6 0">
      <a-camera
        look-controls
        wasd-controls>
      </a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
