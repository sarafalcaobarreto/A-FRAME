<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">

    <title>A-FRAME — Sara</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>

    <a-scene>

      <!-- ================================= -->
      <!-- CÉU GALÁCTICO -->
      <!-- ================================= -->

      <a-sky color="#050014"></a-sky>

      <!-- Estrelas criadas automaticamente -->
      <a-entity id="stars"></a-entity>


      <!-- ================================= -->
      <!-- ILUMINAÇÃO -->
      <!-- ================================= -->

      <a-light
        type="ambient"
        color="#7B00FF"
        intensity="1.5">
      </a-light>

      <a-light
        type="point"
        color="#FF00FF"
        intensity="4"
        position="0 3 -3">
      </a-light>

      <a-light
        type="point"
        color="#00FFFF"
        intensity="3"
        position="-3 2 -4">
      </a-light>


      <!-- ================================= -->
      <!-- CUBO NEON -->
      <!-- ================================= -->

      <a-box
        position="-1.5 1 -3.5"
        rotation="0 45 0"
        width="1.5"
        height="1.5"
        depth="1.5"
        material="
          color: #7B00FF;
          emissive: #7B00FF;
          emissiveIntensity: 1.5;
          roughness: 0.2;
          metalness: 0.5
        ">
      </a-box>


      <!-- ================================= -->
      <!-- ESFERA NEON -->
      <!-- ================================= -->

      <a-sphere
        position="0 1.5 -4.5"
        radius="1"
        material="
          color: #FF0080;
          emissive: #FF0080;
          emissiveIntensity: 2;
          roughness: 0.1;
          metalness: 0.3
        ">
      </a-sphere>


      <!-- ================================= -->
      <!-- CILINDRO NEON -->
      <!-- ================================= -->

      <a-cylinder
        position="1.7 1 -3.5"
        radius="0.6"
        height="2"
        material="
          color: #FF6A00;
          emissive: #FF4500;
          emissiveIntensity: 2;
          roughness: 0.15;
          metalness: 0.4
        ">
      </a-cylinder>


      <!-- ================================= -->
      <!-- PLATAFORMA -->
      <!-- ================================= -->

      <a-box
        position="0 0 -4"
        width="6"
        height="0.1"
        depth="5"
        material="
          color: #39FF14;
          emissive: #2CFF05;
          emissiveIntensity: 0.8;
          roughness: 0.15;
          metalness: 0.8
        ">
      </a-box>


      <!-- ================================= -->
      <!-- LINHAS NEON DA PLATAFORMA -->
      <!-- ================================= -->

      <a-box
        position="0 0.07 -1.5"
        width="6"
        height="0.03"
        depth="0.03"
        color="#00FFFF">
      </a-box>

      <a-box
        position="0 0.07 -6.5"
        width="6"
        height="0.03"
        depth="0.03"
        color="#FF00FF">
      </a-box>

      <a-box
        position="-3 0.07 -4"
        width="0.03"
        height="0.03"
        depth="5"
        color="#7B00FF">
      </a-box>

      <a-box
        position="3 0.07 -4"
        width="0.03"
        height="0.03"
        depth="5"
        color="#00FFFF">
      </a-box>


      <!-- ================================= -->
      <!-- TEXTO -->
      <!-- ================================= -->

      <a-text
        value="oie, eu me chamo Sara! <3!"
        position="-1.8 3.2 -4"
        color="#FFFFFF"
        width="5"
        align="center"
        side="double">
      </a-text>


      <!-- ================================= -->
      <!-- CÂMERA -->
      <!-- ================================= -->

      <a-camera
        position="0 1.6 2">
      </a-camera>


      <!-- ================================= -->
      <!-- CONTROLES VR -->
      <!-- ================================= -->

      <a-entity
        laser-controls="hand: left">
      </a-entity>

      <a-entity
        laser-controls="hand: right">
      </a-entity>

    </a-scene>


    <!-- ================================= -->
    <!-- GERADOR DE ESTRELAS -->
    <!-- ================================= -->

    <script>

      const starContainer = document.querySelector("#stars");

      for (let i = 0; i < 250; i++) {

        const star = document.createElement("a-sphere");

        const x = (Math.random() - 0.5) * 40;
        const y = (Math.random() - 0.5) * 25;
        const z = -Math.random() * 30;

        const size = Math.random() * 0.035 + 0.01;

        star.setAttribute("position", `${x} ${y} ${z}`);
        star.setAttribute("radius", size);

        const colors = [
          "#FFFFFF",
          "#00FFFF",
          "#FF00FF",
          "#7B00FF",
          "#FF66CC"
        ];

        const color =
          colors[Math.floor(Math.random() * colors.length)];

        star.setAttribute("material", `
          color: ${color};
          emissive: ${color};
          emissiveIntensity: 3
        `);

        starContainer.appendChild(star);
      }

    </script>

  </body>
</html>
