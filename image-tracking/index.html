
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realidade Aumentada - Image Tracking</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Objetos apresentados quando a imagem é detetada -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Esfera central -->
      <a-sphere
        position="0 0.35 0"
        radius="0.18"
        color="#00e5ff"
        material="emissive: #0077ff; emissiveIntensity: 0.8">
      </a-sphere>

      <!-- Anel decorativo -->
      <a-torus
        position="0 0.35 0"
        radius="0.3"
        radius-tubular="0.018"
        color="#ff00cc"
        rotation="90 0 0">
      </a-torus>

      <!-- Texto -->
      <a-text
        value="T-REX!"
        position="0 -0.3 0"
        align="center"
        color="#ffffff"
        width="1.5">
      </a-text>

      <!-- Cubo secundário -->
      <a-box
        position="0.35 -0.05 0"
        scale="0.12 0.12 0.12"
        color="#ff9800">
      </a-box>

    </a-entity>
  </a-scene>
</body>
</html>
